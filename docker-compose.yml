# Local SQL Server for development:  docker compose up -d
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: logistics-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Logistics_Dev_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql-data:
